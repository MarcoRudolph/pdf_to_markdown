services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in your local shell (not Git)}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_PAGES: ${MAX_PAGES:-100}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
